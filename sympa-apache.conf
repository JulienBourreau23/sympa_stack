<VirtualHost *:80>
  ServerName ${SYMPA_DOMAIN}
  ServerAdmin ${SYMPA_LISTMASTER}

  # UI Sympa
  ScriptAlias /sympa /usr/lib/cgi-bin/sympa/wwsympa.fcgi
  <Directory "/usr/lib/cgi-bin/sympa">
    Options +ExecCGI
    Require all granted
  </Directory>

  # Static
  Alias /static-sympa /usr/share/sympa/static_content
  <Directory "/usr/share/sympa/static_content">
    Require all granted
  </Directory>

  ErrorLog ${APACHE_LOG_DIR}/sympa_error.log
  CustomLog ${APACHE_LOG_DIR}/sympa_access.log combined
</VirtualHost>
