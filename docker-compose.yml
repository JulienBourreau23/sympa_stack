version: "3.9"

services:
  db:
    image: postgres:18.0-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: sympa
      POSTGRES_USER: sympa
      POSTGRES_PASSWORD: sympa
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  sympa:
    build:
      context: ./sympa
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: sympa
      DB_USER: sympa
      DB_PASSWORD: sympa
    ports:
      - "8080:80"
    volumes:
      - sympa_etc:/etc/sympa
      - sympa_var:/var/lib/sympa
      - sympa_spool:/var/spool/sympa

volumes:
  pg_data: {}
  sympa_etc: {}
  sympa_var: {}
  sympa_spool: {}
